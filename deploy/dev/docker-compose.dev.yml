version: "3.9"

# Dev — everything in Docker.
# WhisperCrawl connects to whisper and ollama via internal Docker network.
#
# Usage:
#   docker compose -f deploy/dev/docker-compose.dev.yml up -d
#   docker compose -f deploy/dev/docker-compose.dev.yml run --rm whispercrawl --once
#
# After changing src/ or pyproject.toml, rebuild the whispercrawl image:
#   docker compose -f deploy/dev/docker-compose.dev.yml up -d --build whispercrawl
#
# Config: edit deploy/dev/config.yaml — the dev config, which pre-wires two ASR
#   engines (EPIC-054). Service URLs and paths are injected via environment
#   variables (see the whispercrawl.environment block below); no manual edits needed.

services:

  whisper:
    image: ${ASR_IMAGE:-asr-webservice:latest}   # mirrored from onerahmet/openai-whisper-asr-webservice; override ASR_IMAGE for an internal registry
    ports:
      - "9000:9000"
    environment:
      ASR_MODEL: ${ASR_MODEL:-tiny}          # tiny | base | small | medium | large
      ASR_ENGINE: ${ASR_ENGINE:-whisperx}
      HF_TOKEN: ${HF_TOKEN}   # set in deploy/dev/.env (see deploy/dev/.env.example)
      HF_HUB_DISABLE_TELEMETRY: true
      # HF_HUB_OFFLINE: true    # enable after pyannote model is cached in hf_cache volume
    volumes:
      - whisper_cache:/root/.cache/whisper
      - hf_cache:/root/.cache/huggingface   # persists pyannote diarization model
    restart: unless-stopped

  whisper2:
    image: ${ASR_IMAGE:-asr-webservice:latest}   # second ASR engine for comparison (EPIC-054)
    ports:
      - "9001:9000"
    environment:
      ASR_MODEL: ${ASR_MODEL2:-v1_rnnt}      # gigaam: v1_rnnt | v1_ctc | v2_rnnt | v2_ctc
      ASR_ENGINE: ${ASR_ENGINE2:-gigaam}    # a different engine from `whisper` so the two results differ
      ASR_REQUEST_LOGGING: ${ASR_REQUEST_LOGGING2:-true}
      HF_TOKEN: ${HF_TOKEN}
      HF_HUB_DISABLE_TELEMETRY: true
      # HF_HUB_OFFLINE: true
    volumes:
      - whisper2_cache:/root/.cache/whisper
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    # GPU support (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "gemma3:1b"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  whispercrawl:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      WATCH_DIR: /audio
      WHISPER_URL: http://whisper:9000
      WHISPER2_URL: http://whisper2:9000
      OLLAMA_URL: http://ollama:11434
      LOGS_DIR: /logs
    volumes:
      - ../../audio:/audio
      - ./config.yaml:/config.yaml:ro   # deploy/dev/config.yaml — the two-engine dev config (EPIC-054)
      - ../../logs:/logs
      - ../../db:/db
    depends_on:
      whisper:
        condition: service_started
      whisper2:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  whisper_cache:
  whisper2_cache:
  hf_cache:
  ollama_data:
