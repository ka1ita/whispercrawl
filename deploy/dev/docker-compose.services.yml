version: "3.9"

# Whisper (x2) + Ollama only — use when running WhisperCrawl locally (python -m whispercrawl).
# Services are exposed on localhost so deploy/dev/config.yaml defaults
# (127.0.0.1:9000 / 127.0.0.1:9001 / localhost:11434) work as-is.
#
# Requires HF_TOKEN in deploy/dev/.env for whisperx diarization (see deploy/dev/.env.example).
#
# Usage:
#   docker compose -f deploy/dev/docker-compose.services.yml up -d

services:

  whisper:
    image: ${ASR_IMAGE:-asr-webservice:latest}   # mirrored from onerahmet/openai-whisper-asr-webservice; override ASR_IMAGE for an internal registry
    ports:
      - "9000:9000"
    environment:
      ASR_MODEL: ${ASR_MODEL:-tiny}          # tiny | base | small | medium | large
      ASR_ENGINE: ${ASR_ENGINE:-whisperx}
      HF_TOKEN: ${HF_TOKEN}   # set in deploy/dev/.env (see deploy/dev/.env.example)
      HF_HUB_DISABLE_TELEMETRY: true
      # HF_HUB_OFFLINE: true    # enable after pyannote model is cached in hf_cache volume
    volumes:
      - whisper_cache:/root/.cache/whisper
      - hf_cache:/root/.cache/huggingface   # persists pyannote diarization model
    restart: unless-stopped

  whisper2:
    image: ${ASR_IMAGE:-asr-webservice:latest}   # second ASR engine for comparison (EPIC-054)
    ports:
      - "9001:9000"
    environment:
      ASR_MODEL: ${ASR_MODEL2:-tiny}          # tiny | base | small | medium | large
      ASR_ENGINE: ${ASR_ENGINE2:-faster_whisper}   # a different engine from `whisper` so the two results differ
      HF_TOKEN: ${HF_TOKEN}
      HF_HUB_DISABLE_TELEMETRY: true
      # HF_HUB_OFFLINE: true
    volumes:
      - whisper2_cache:/root/.cache/whisper
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    # GPU support (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "gemma3:1b"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  whisper_cache:
  whisper2_cache:
  hf_cache:
  ollama_data:
