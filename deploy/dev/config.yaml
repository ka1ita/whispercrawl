# WhisperCrawl — DEV configuration (EPIC-054)
#
# This is the dev copy of the project-root config.yaml. It pre-wires TWO ASR
# engines (transcription.engines below): `whisperx` on :9000 and `gigaam` on
# :9001. The project-root config.yaml stays the single-engine working example.
#
# Used by:
#   - the dev Docker stack   (deploy/dev/docker-compose.dev.yml — mounts this file)
#   - the dev local-python wrappers (deploy/dev/app-python*.sh — --config deploy/dev/config.yaml)
#
# Start the two ASR services with deploy/dev/services-docker-start.sh
# (host ports 9000 / 9001) or the full stack with deploy/dev/app-docker-start.sh.

# Directory to scan for audio/video files (recursive)
watch_dir: ${WATCH_DIR:./audio/}

# File extensions to process
extensions:
  - .mp3
  - .wav
  - .m4a
  - .ogg
  - .mp4
  - .mkv
  - .avi

# Rescan mode:
#   false = skip files that already have output (default)
#   true  = reprocess all files regardless of existing output
rescan: false

# Processing order:
#   per_file (default) = every step runs on one file before moving to the next
#   per_step = each step (transcribe, postprocess, file-summarize) runs across all pending
#              files before the next step starts — reduces Ollama model-swap overhead when
#              postprocessing and file_summarization use different models
processing_mode: per_file

# Files whose name contains this string are skipped entirely (case-insensitive); set to "" to disable
skip_marker: _skip

# Files older than this are skipped and newer files are processed first (mtime, in days); omit/null = unbounded
max_age_days: 180

# Persisted index of processed files (SQLite, always on) — avoids re-checking the whole
# tree every run. Deleting the file is safe: the next run re-derives it from existing
# output files (no reprocessing). The index also stores each file's raw ASR transcript
# and post-processed text, which powers:
#   whispercrawl --refresh  — re-run post-processing, summarization, and formatting from
#                             the stored transcript with the current config, no whisper call.
# Pipeline failures are recorded here too (nothing is written beside the audio):
#   whispercrawl --errors   — list what failed and why; exits non-zero if anything is outstanding.
# state:
#   path: ./db/state.db     # override the default location (own mount, writable disk, …)
#   # (a legacy <watch_dir>/.whispercrawl/state.db is moved here automatically on first run)

# Max files to process per run; the rest are picked up on the next scheduled run; omit/null = unlimited
# max_files_per_run: 500

# ── Formatter ─────────────────────────────────────────────────────────────────
formatter:
  format: html              # txt | html | md (default: txt)
  enabled: true           # set to false to skip format conversion
  speaker_style: bold     # bold | italic | plain — emphasis on [SPEAKER_XX]: label (default: bold)
  text_placement: same_line  # same_line | new_line — where transcript text follows the label (default: same_line)

# ── Result document (EPIC-047) ────────────────────────────────────────────────
# Each processed file yields ONE result beside the audio (<file>_<engine>.<ext>): the
# summary section (when file_summarization is on) followed by the transcript.
# Each directory yields ONE result (_<dirname>_<engine>.<ext> / <dirname>_<engine>.<ext>): the
# directory summary followed by every transcript concatenated. The raw ASR and
# intermediate post-processed text live in the processing index, not on disk.
result:
  file_sections: [summary, transcript]   # order; drop "summary" to omit it from per-file results
  dir_sections: [summary, transcript]    # "transcript" here = the concatenated per-file transcripts
  summary_heading: Резюме
  transcript_heading: Транскрипция
  heading_level: 1                       # number of leading '#' on section headings (1–6)
  # separator: "\n\n"                    # between rendered sections
  # include_missing_headings: false      # emit a section heading even when it produced nothing

# ── Transcription — two ASR engines (EPIC-048 / EPIC-054) ─────────────────────
# Shared settings live on this base block; each engine in `engines:` inherits
# them and overrides what it names. Every engine transcribes every file and gets
# its own result files (<file>_<name>.<ext> / _<dirname>_<name>.<ext>) and its
# own rows in the processing index.
transcription:
  language: ru                    # Default language: auto, ru, en, etc.
  diarize: true                    # Enable speaker diarization (requires HF_TOKEN in the ASR container — both whisperx and gigaam use pyannote)
  timeout: 3600                     # HTTP timeout in seconds (whisperx large on CPU is slow)
  speaker_timestamps: true          # Prefix each speaker segment with HH:MM:SS start time
  # initial_prompt: ""               # Hint text passed to the model
  engines:
    - name: whisperx
      # localhost stalls multipart uploads on Windows (IPv6 ::1 → Docker Desktop
      # proxy); use 127.0.0.1. The dev Docker stack overrides WHISPER_URL to
      # http://whisper:9000 (internal network).
      url: ${WHISPER_URL:http://127.0.0.1:9000}
    - name: gigaam
      url: ${WHISPER2_URL:http://127.0.0.1:9001}   # stack overrides to http://whisper2:9000
      # inherits diarize: true / speaker_timestamps: true from the base block

# ── Post-Processing ───────────────────────────────────────────────────────────
postprocessing:
  llm_enabled: false    # LLM correction via ollama (default: true)
  regex_enabled: true  # Regex cleanup pass (default: true)
  url: ${OLLAMA_URL:http://127.0.0.1:11434}       # ollama base URL
  model: gemma3:1b
  prompt: |
    Ты редактор транскрипций. Исправь грамматику, пунктуацию и очевидные
    ошибки распознавания речи в тексте ниже. Сохрани смысл и стиль речи.
    Верни только исправленный текст без пояснений. Не удаляй спикера и время ([SPEAKER_XX XX:XX:XX]).
  regex_patterns:
    - '.*Субтитры создавал\n'
    - '.*Редактор субтитров\n'
    - '.*Продолжение следует\n'
    - '.*Thank you for watching\n'
    - '.*Текст читал\n'
    - '.*Подпишись на канал\n'
    - '.*Интригующая музыка\n'
    - '.*Тревожная музыка\n'
    - '.*watching\n'
    - '.*UNKNOWN: Субтитры сделал DimaTorzok\n'
    - '.*Субтитры сделал DimaTorzok\n'
    - '.*Продолжаем.\n'
    - '.*До новых встреч!\n'
    - '.*Субтитры делал DimaTorzok\n'
    - '.*ЗВОНОК В ДВЕРЬ\n'
    - '.*Субтитры подогнал «Симон»\n'
    - '.*Спасибо за просмотр\n'
    - '.*ДИНАМИЧНАЯ МУЗЫКА\n'
    - '.*В.ПУТИН\n'
    - '.*СМЕХ СМЕХ\n'
    - '.*ЗВОНОК ТЕЛЕФОНА\n'
    - '.*Спасибо за внимание.\n'
    - '.*Субтитры подогнали Симон.\n'
    - '.*СПОКОЙНАЯ МУЗЫКА\n'
    - '.*Аминь.\n'
    - '.*Аллилуйя.\n'
    - '.*Пам-пам-пам-пам-пам. Пам-пам-пам-пам-пам\n'
  timeout: 600                      # HTTP timeout in seconds
  filename_timestamp_format:
    - "%Y-%m-%d_%H_%M_%S"
    - "%Y-%m-%d-%H-%M-%S"

# ── Per-File Summarization ────────────────────────────────────────────────────
file_summarization:
  llm_enabled: false
  summarize_source: postprocessed   # "postprocessed" (_fix) | "original" (transcript)
  url: ${OLLAMA_URL:http://127.0.0.1:11434}
  model: gemma3:1b
  prompt: |
    Составь краткое резюме транскрипции ниже. Выдели ключевые темы,
    принятые решения и задачи к выполнению. Отвечай на языке текста.
  timeout: 300                      # HTTP timeout in seconds

# ── Per-Directory Summarization ───────────────────────────────────────────────
dir_summarization:
  concat_source: postprocessed      # "postprocessed" | "original" — which per-file text to concatenate
  underscore_prefix: true        # true → the one dir result is named _<dirname>_<engine>.<ext> (else <dirname>_<engine>.<ext>)
  llm_enabled: false
  url: ${OLLAMA_URL:http://127.0.0.1:11434}
  model: gemma3:1b
  prompt: |
    Ниже приведены транскрипции нескольких записей одной встречи или сессии.
    Напиши единое сводное резюме: главные темы, итоги и договорённости.
    Отвечай на языке текста.
  timeout: 60                      # HTTP timeout in seconds

# ── Cleanup ──────────────────────────────────────────────────────────────────
# `whispercrawl --cleanup` (alone, or with `--once`) deletes the consolidated
# result files this version writes — <file>_<engine>.<ext> and
# _<dirname>_<engine>.<ext>, one set per ASR engine, any formatter extension —
# and empties the processing index. It is not configurable. Pre-047 sidecars
# (_fix/_sum/_all/_concat) and _err.txt files are left alone — delete those by
# hand when upgrading an old catalog. With `--once --cleanup` a file's result is
# removed only after every pipeline step for that file succeeded.

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  # Application log (console + optional rotating file)
  app_log_file: ${LOGS_DIR:./logs}/whispercrawl.log   # omit to log to console only
  app_log_level: INFO                      # DEBUG | INFO | WARNING | ERROR
  app_log_max_bytes: 10485760              # 10 MB per file
  app_log_backup_count: 5                  # number of rotated backups to keep

  # Service interaction log (structured ndjson per HTTP call)
  requests: true
  diarize_log: false               # Save raw JSON diarization response under <log_dir>/diarize/<engine>/<relative-path>.json
  log_dir: ${LOGS_DIR:./logs}/   # directory — writes service_requests.ndjson inside
  # log_file: ./my.ndjson     # explicit path override (takes precedence over log_dir)
  max_text_length: 500        # truncate request/response text in log (null = unlimited)

# ── Schedule ──────────────────────────────────────────────────────────────────
# Use either cron or interval, not both. Comment out both to require --once flag.
schedule:
  # cron: "0 * * * *"      # every hour at :00
  interval: 10m             # every 10 minutes (supports: 30s, 15m, 2h)
