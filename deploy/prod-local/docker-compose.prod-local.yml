version: "3.9"

# prod-local — all services on a single server, no internet required.
# All images are loaded from dist/ by setup.sh before first run.
#
# Usage:
#   bash setup.sh          # first-run: load images, create dirs, copy .env
#   bash service-start.sh  # start all services in background
#   bash service-down.sh   # stop all services
#   docker compose -f docker-compose.prod-local.yml logs -f

services:

  asr-webservice:
    image: ${ASR_IMAGE:-asr-webservice:latest}   # loaded from dist/asr-webservice.tar by setup.sh; set ASR_IMAGE to a registry path to pull instead
    environment:
      ASR_MODEL: ${ASR_MODEL:-small}    # tiny | base | small | medium | large
      ASR_ENGINE: whisperx
      HF_TOKEN: ${HF_TOKEN}
      HF_HUB_DISABLE_TELEMETRY: true
      # HF_HUB_OFFLINE: true            # enable after pyannote model is cached
    volumes:
      - asr_webservice_cache:/root/.cache/whisper
      - hf_cache:/root/.cache/huggingface
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    # GPU support (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "gemma3:1b"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  whispercrawl:
    image: whispercrawl:latest
    environment:
      WATCH_DIR: /audio
      ASR_WEBSERVICE_URL: http://asr-webservice:9000
      OLLAMA_URL: http://ollama:11434
      LOGS_DIR: /logs
    volumes:
      - ./audio:/audio:Z
      - ./config.yaml:/config.yaml:ro,Z
      - ./logs:/logs:Z
      - ./db:/db:Z
    depends_on:
      asr-webservice:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  asr_webservice_cache:
  hf_cache:
  ollama_data:
