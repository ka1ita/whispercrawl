# asr-crawler configuration — prod-local (all-in-one server)
# Service URLs are pre-set to internal Docker network names; no changes needed there.
# Review language, model, schedule, and other settings for your environment.

watch_dir: ${WATCH_DIR:./audio/}

extensions:
  - .mp3
  - .wav
  - .m4a
  - .ogg
  - .mp4
  - .mkv
  - .avi

rescan: false

# Processing order:
#   per_file (default) = every step runs on one file before moving to the next
#   per_step = each step (transcribe, postprocess, file-summarize) runs across all pending
#              files before the next step starts — reduces Ollama model-swap overhead when
#              postprocessing and file_summarization use different models
processing_mode: per_file

# Files whose name contains this string are skipped entirely (case-insensitive); set to "" to disable
# skip_marker: _skip

# Files older than this are skipped and newer files are processed first (mtime, in days); omit/null = unbounded
# max_age_days: 180

# Persisted index of processed files (SQLite, always on) — avoids re-checking the whole
# tree every run. Deleting the file is safe: the next run re-derives it from existing
# output files (no reprocessing). The index also stores each file's raw ASR transcript
# and post-processed text, which powers:
#   asr-crawler --refresh  — re-run post-processing, summarization, and formatting from
#                             the stored transcript with the current config, no whisper call.
# Failures are recorded here too (nothing is written beside the audio):
#   asr-crawler --errors   — list what failed and why; exits non-zero if anything is outstanding.
# state:
#   path: /db/state.db     # override the default location (<config dir>/db/state.db)
#   # (a legacy /audio/.whispercrawl/state.db is moved here automatically on first run)

# Max files to process per run; the rest are picked up on the next scheduled run; omit/null = unlimited
# max_files_per_run: 500

# Park the pipeline after this many consecutive file failures (counted across runs).
# A fully-successful file resets the counter; once parked, every run stops until
# `asr-crawler --reset-errors`. Omit/null = disabled.
# max_error_count: 20

# ── Formatter ─────────────────────────────────────────────────────────────────
formatter:
  format: txt               # txt | html | md (default: txt)
  # enabled: true           # set to false to skip format conversion
  # speaker_style: bold     # bold | italic | plain — emphasis on [SPEAKER_XX]: label (default: bold)
  # text_placement: same_line  # same_line | new_line — where transcript text follows the label (default: same_line)

# ── Result document (EPIC-047) ────────────────────────────────────────────────
# One result beside each audio file and one per directory: summary section
# (when enabled) then the transcript. Raw/intermediate text lives in the index.
result:
  file_sections: [summary, transcript]
  dir_sections: [summary, transcript]
  summary_heading: Резюме
  transcript_heading: Транскрипция
  heading_level: 1

# ── Transcription ─────────────────────────────────────────────────────────────
transcription:
  url: ${ASR_WEBSERVICE_URL:http://asr-webservice:9000}
  language: ru                    # Default language: auto, ru, en, etc.
  diarize: true                   # Requires HF_TOKEN set in .env
  output_suffix: ""
  timeout: 3600
  # speaker_timestamps: false          # Prefix each speaker segment with HH:MM:SS start time
  # Multiple ASR engines (EPIC-048): leave 'engines' unset for one engine.
  # concurrency: 1        # EPIC-056 — engines' /asr calls in flight at once (1 = sequential)
  # engines:
  #   - name: whisperx
  #     url: http://asr-webservice:9000
  #   - name: faster
  #     url: http://asr-webservice2:9000
  #     diarize: false

# ── Post-Processing ───────────────────────────────────────────────────────────
postprocessing:
  llm_enabled: false
  regex_enabled: true
  url: ${OLLAMA_URL:http://ollama:11434}
  model: gemma3:1b
  prompt: |
    Ты редактор транскрипций. Исправь грамматику, пунктуацию и очевидные
    ошибки распознавания речи в тексте ниже. Сохрани смысл и стиль речи.
    Верни только исправленный текст без пояснений.
  regex_patterns:
#    - '.*Субтитры сделал DimaTorzok.*\n?' - в середине строки
#    - '.*Субтитры сделал DimaTorzok\n' - конец строки
    - '.*Субтитры создавал\n'
    - '.*Редактор субтитров\n'
    - '.*Продолжение следует\n'
    - '.*Thank you for watching\n'
    - '.*Текст читал\n'
    - '.*Подпишись на канал\n'
    - '.*Интригующая музыка\n'
    - '.*Тревожная музыка\n'
    - '.*watching\n'
    - '.*UNKNOWN: Субтитры сделал DimaTorzok\n'
    - '.*Субтитры сделал DimaTorzok\n'
    - '.*Продолжаем.\n'
    - '.*До новых встреч!\n'
    - '.*Субтитры делал DimaTorzok\n'
    - '.*ЗВОНОК В ДВЕРЬ\n'
    - '.*Субтитры подогнал «Симон»\n'
    - '.*Спасибо за просмотр\n'
    - '.*ДИНАМИЧНАЯ МУЗЫКА\n'
    - '.*В.ПУТИН\n'
    - '.*СМЕХ СМЕХ\n'
    - '.*ЗВОНОК ТЕЛЕФОНА\n'
    - '.*Спасибо за внимание.\n'
    - '.*Субтитры подогнали Симон.\n'
    - '.*СПОКОЙНАЯ МУЗЫКА\n'
    - '.*Аминь.\n'
    - '.*Аллилуйя.\n'
    - '.*Пам-пам-пам-пам-пам. Пам-пам-пам-пам-пам\n'
  timeout: 600
  # output_suffix / replace_transcription: deprecated no-ops since EPIC-047
  filename_timestamp_format:
    - "%Y-%m-%d_%H_%M_%S"
    - "%Y-%m-%d_%H-%M-%S"
    - "%Y-%m-%d-%H-%M-%S"
  #filename_timestamp_format: "%Y-%m-%d_%H_%M_%S"  # strptime format for filename stem to offset speaker timestamps
  #   e.g. "%Y-%m-%d_%H_%M_%S" matches "2026-08-21_09_04_40"; null = disabled
  #   accepts a list of formats tried in order

# ── Per-File Summarization ────────────────────────────────────────────────────
file_summarization:
  llm_enabled: true
  summarize_source: postprocessed
  url: ${OLLAMA_URL:http://ollama:11434}
  model: gemma3:1b
  prompt: |
    Составь краткое резюме транскрипции ниже. Выдели ключевые темы,
    принятые решения и задачи к выполнению. Отвечай на языке текста.
  timeout: 300
  # output_suffix: deprecated no-op since EPIC-047

# ── Per-Directory Summarization ───────────────────────────────────────────────
dir_summarization:
  concat_source: postprocessed      # "postprocessed" | "original"
  underscore_prefix: false          # true → dir result named _<dirname>.<ext>
  llm_enabled: true
  url: ${OLLAMA_URL:http://ollama:11434}
  model: gemma3:1b
  prompt: |
    Ниже приведены транскрипции нескольких записей одной встречи или сессии.
    Напиши единое сводное резюме: главные темы, итоги и договорённости.
    Отвечай на языке текста.
  timeout: 300
  # concat_suffix / output_suffix: deprecated no-ops since EPIC-047

# ── Cleanup ──────────────────────────────────────────────────────────────────
# `asr-crawler --cleanup` (alone, or with `--once`) deletes the consolidated
# result files this version writes (<file>.<ext> and _<dirname>.<ext>, one set
# per ASR engine, any extension) and empties the processing index. It is not
# configurable. Pre-047 sidecars and _err.txt files are left alone. With
# `--once --cleanup` a file's result is removed only after every step succeeded.

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  app_log_file: ${LOGS_DIR:./logs}/asr-crawler.log
  app_log_level: INFO
  app_log_max_bytes: 10485760
  app_log_backup_count: 5
  requests: true
  diarize_log: false               # Save raw JSON diarization response under <log_dir>/diarize/<relative-path>.json
  log_dir: ${LOGS_DIR:./logs}/
  max_text_length: 500

# ── Schedule ──────────────────────────────────────────────────────────────────
schedule:
  interval: 30s
